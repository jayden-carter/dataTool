<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Data Cart</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #ececec;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .background {
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }
    .shape {
      width: 200px;
      height: 200px;
      background: linear-gradient(#1845ad, #23a2f6);
      position: absolute;
      border-radius: 50%;
    }
    .shape:first-child {
      top: -80px;
      left: -80px;
    }
    .shape:last-child {
      bottom: -80px;
      right: -80px;
    }
    form {
      width: 400px;
      background-color: rgba(255, 255, 255, 0.13);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
      padding: 50px 35px;
    }
    form h3 {
      font-size: 32px;
      font-weight: 500;
      line-height: 42px;
      text-align: center;
      color: #000;
    }
    label {
      display: block;
      margin-top: 30px;
      font-size: 16px;
      font-weight: 500;
      color: #000;
    }
    input {
      display: block;
      height: 50px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.07);
      border-radius: 3px;
      padding: 0 10px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 300;
      border: none;
      color: #000;
    }
    button {
      margin-top: 50px;
      width: 100%;
      background-color: #ffffff;
      color: #080710;
      padding: 15px 0;
      font-size: 18px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: none;
    }
    #error {
      color: red;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form id="loginForm">
    <h3>Data Cart</h3>
    <label for="email">
      Email
      <input type="email" placeholder="Email" id="email" value="jcarter6810@gmail.com" required>
    </label>
    <label for="password">
      Password
      <input type="password" placeholder="Password" id="password" required>
    </label>
    <button id="submit" type="submit">Log In</button>
    <div class="social"></div>
    <p id="error" class="text-red-500 mt-4"></p>
  </form>
  <script type="module" src="firebaseConfig.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
