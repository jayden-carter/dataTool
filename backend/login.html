<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Data Cart</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <!-- You can add your stylesheet here -->
  <link href="register.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Load login.js as a module -->
  <script type="module" src="login.js" defer></script>
</head>
<body>
  <div class="background">
    <!-- Optional background shapes if desired -->
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <form id="loginForm">
    <h3>Data Cart</h3>

    <label for="email">
      Email
      <input type="email" placeholder="Email" id="email" required>
    </label>

    <label for="password">
      Password
      <input type="password" placeholder="Password" id="password" required>
    </label>

    <button id="submit" type="submit">Log In</button>

    <div class="social">
      <!-- You can add social login buttons here if desired -->
    </div>

    <div class="form">
      <p>Don't have an account? <a href="register.html">Sign Up</a></p>
    </div>

    <p id="error" class="text-center text-red-500 mt-4 hidden"></p>

  </form>
</body>
</html>
