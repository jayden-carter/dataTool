/* Header container */
.header-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.5rem;
  margin-bottom: 1.5rem;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border-radius: 0.75rem;
}

/* Left (app name + menu) */
.header-left {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}
.app-name {

/* Center (search) */
.header-center {
  flex: 1; /* take up leftover space */
  display: flex;
  justify-content: center;
}
.search-wrapper {
  position: relative;
  width: 40%; /* adjust to taste */
}
.search-wrapper input {
  width: 100%;
  padding: 0.5rem 2.5rem 0.5rem 0.75rem;
  border: none;
  border-radius: 0.5rem;
}
.search-wrapper i.fa-search {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: #555;
}

/* Right (icons + profile) */
.header-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}
.header-right i {
  font-size: 1.1rem;
  color: #333;
  cursor: pointer;
}
.profile img {
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  object-fit: cover;
  cursor: pointer;
}
/* GRID of 4 containers */
.sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 1.5rem;
}

/* All sections share header's frosted-glass style */
.section {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  border-radius: 0.75rem;
  padding: 1rem;
  min-height: 200px;
  color: #333;
}

/* Overview tweaks */
.overview-container h2 {
  margin-bottom: 1rem;
}
.overview-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
}
.card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem;
  border-radius: 0.5rem;
  background: rgba(255, 255, 255, 0.25);
}
.card i {
  font-size: 1.5rem;
}
.card-content .label {
  display: block;
  font-size: 0.9rem;
  color: #555;
}
.card-content .value {
  display: block;
  font-size: 1.3rem;
  font-weight: bold;
}
.card-content .compare {
  display: block;
  font-size: 0.8rem;
  color: #777;
}
/* === Heatmap grid === */
#attendance-chart {
  display: grid;
  /* one col for day-labels, then 24 for each hour */
  grid-template-columns: 3rem repeat(24, 1fr);
  gap: 0.25rem;
  margin-top: 1rem;
}

/* shared cell style */
#attendance-chart .cell {
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 0.25rem;
}

/* header row (hour labels) */
#attendance-chart .hour-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: #333;
}

/* first column (day labels) */
#attendance-chart .day-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #333;
}

/* default heat cell */
#attendance-chart .heat-cell {
  background: #f0f0f0;
}
/* —— Revenue chart styling —— */
#revenue-report canvas {
  width: 100% !important;
  max-height: 300px;
  margin-top: 1rem;
}

/* —— Top-items cards —— */
.top-items {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.item-card {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(10px);
  border-radius: 0.5rem;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;

.item-card .item-name {
  font-size: 1rem;
  font-weight: 600;
  color: #333;
}

.item-card .bar-wrapper {
  width: 100%;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 5px;
  height: 8px;
  overflow: hidden;
  margin: 0.5rem 0;
}

.item-card .bar {
  height: 100%;
  background: purple;
  border-radius: 5px;
}

.item-card .count {
  font-size: 0.9rem;
  color: #333;
}

.upload-section {

    padding: 20px;
    background: #fff;
    border-radius: 8px;

.processed-files {

.file-list {

.file-info {

.status-message {

.status-message.success {

.status-message.error {

.chart-container {

.items-container {

.item-name {

.item-stats {

.trend-stats {

.change {

<script>
    $(document).ready(function() {
  $.ajax({
    url: 'data.php',
    method: 'GET',
    dataType: 'json'
  }).done(function(res) {
    // res.current and res.last
    $('#revenue .value').text('$' + res.current.revenue.toLocaleString());
    $('#revenue .compare').text('Last: $' + res.last.revenue.toLocaleString());

    $('#profit .value').text('$' + res.current.profit.toLocaleString());
    $('#profit .compare').text('Last: $' + res.last.profit.toLocaleString());

    $('#sold .value').text(res.current.time_sold);
    $('#sold .compare').text('Last: ' + res.last.time_sold);

    // growth is a percent
    $('#growth .value').text(res.current.growth.toFixed(1) + '%');
    $('#growth .compare').text('Last: ' + res.last.growth.toFixed(1) + '%');
  }).fail(function(err) {
    console.error('Data load failed', err);
  });
});

$(function() {
  $.getJSON('attendance.php', function(res) {
    const data = res.data;
    // prepare sorted days
    const days = Object.keys(data).sort();
    // compute max count
    let maxCount = 0;
    days.forEach(d =>
      Object.values(data[d]).forEach(c => {
        if (c > maxCount) maxCount = c;
      })
    );

    const chart = $('#attendance-chart').empty();

    // 1) top-left corner filler
    chart.append($('<div>').addClass('cell'));

    // 2) hour labels 0 → 23
    for (let h = 0; h < 24; h++) {
      chart.append(
        $('<div>')
          .addClass('cell hour-label')
          .text(h)
      );
    }

    // 3) each row = one day
    const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    days.forEach(date => {
      // day-label
      const wd = new Date(date).getDay();
      chart.append(
        $('<div>')
          .addClass('cell day-label')
          .text(weekday[wd])
      );
      // 24 hours
      for (let h = 0; h < 24; h++) {
        const cnt = data[date][h];
        // map count → gray shade (0→#f0f0f0 to max→#444)
        const shade = Math.round(240 - (cnt / maxCount) * 200);
        const color = `rgb(${shade},${shade},${shade})`;
        chart.append(
          $('<div>')
            .addClass('cell heat-cell')
            .css('background', color)
            .attr('title', `${date} @ ${h}:00 → ${cnt}`)
        );
      }
    });
  });
});
$(function() {
  // ——— 1) Revenue Bar Chart ———
  $.getJSON('revenue.php', function(res) {
    const labels = res.map(r => r.date);
    const data   = res.map(r => r.revenue);
    const ctx    = document.getElementById('revenueChart').getContext('2d');

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Revenue',
          data,
          backgroundColor: 'rgba(128,0,128,0.6)',
          borderRadius: 5
        }]
      },
      options: {
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: v => '$' + v.toLocaleString()
            }
          },
          x: {
            title: { display: true, text: 'Date' }
          }
        }
      }
    });
  });

  // ——— 2) Top Selling Items ———
  $.getJSON('top_items.php', function(res) {
    const container = $('#top-items-container .top-items').empty();
    if (!res.length) {
      container.append('<p>No data available</p>');
      return;
    }
    const maxCount = res[0].count;
    res.forEach(item => {
      const pct = Math.round((item.count / maxCount) * 100);
      const card = $(`
        <div class="item-card">
          <span class="item-name">${item.name}</span>
          <div class="bar-wrapper">
            <div class="bar" style="width:${pct}%"></div>
          </div>
          <span class="count">${item.count} sold</span>
        </div>
      `);
      container.append(card);
    });
  });
});
